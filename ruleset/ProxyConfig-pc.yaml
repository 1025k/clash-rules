# ============================================================================
# Mihomo 优化配置 V2 - 多端口分流版
# ============================================================================

# ==================== 全局配置 ====================
mixed-port: 7890
allow-lan: false
mode: rule
log-level: warning
ipv6: false
find-process-mode: off
tcp-concurrent: true
unified-delay: true

# ==================== 开启网站管理 ================
# external-controller: 127.0.0.1:9090
# secret: "123456"
# external-ui: ./UI
# external-ui-url: "https://ghfast.top/https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

# ==================== 指纹 ======================

global-client-fingerprint: chrome

# ==================== 缓存与状态持久化 =======================

profile: # ← 此函数位置请勿变动！此为模块更新时备份恢复订阅变量范围 ↑
  store-selected: true
  store-fake-ip: true

# ==================== DNS 配置（优化版：速度+稳定+防污染）====================
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip          # Fake-IP 加速+防污染
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  respect-rules: true              # DNS 请求也遵循规则
  cache-algorithm: arc             # 高效缓存算法
  fake-ip-filter:
    - +.m2m
    - injections.adguard.org
    - local.adguard.org
    - +.bogon
    - +.local
    - +.lan
    - +.internal
    - +.localdomain
    - home.arpa
    - 127.0.0.1.sslip.io
    - 127.atlas.skk.moe
    - stun.*
    - +.stun.*
    - +.msftconnecttest.com
    - +.msftncsi.com
    - time.*.com
    - +.pool.ntp.org
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
  # 直连域名专属高速 DNS（带 #DIRECT 防环路）
  direct-nameserver-follow-policy: true
  direct-nameserver:
    - https://223.5.5.5/dns-query#DIRECT
    - https://doh.pub/dns-query#DIRECT
  # 兜底查询：若有冷门域名漏到底部 IP 判定，强制走代理查询国外 DoH，彻底杜绝本地明文泄露
  nameserver:
    - https://1.1.1.1/dns-query#🎯 节点选择
    - https://8.8.8.8/dns-query#🎯 节点选择
  nameserver-policy:
    +.cn: https://223.5.5.5/dns-query#DIRECT
    +.ip138.com: https://223.5.5.5/dns-query#DIRECT
    +.bbkss.org: https://223.5.5.5/dns-query#DIRECT
    +.owolist.cn: https://223.5.5.5/dns-query#DIRECT
    +.qinyues4.cc: https://223.5.5.5/dns-query#DIRECT
    +.todust.cc: https://223.5.5.5/dns-query#DIRECT
    +.yangliq.com: https://223.5.5.5/dns-query#DIRECT
    rule-set:mihomo_nameserver_policy_alibaba: https://223.5.5.5/dns-query#DIRECT
    rule-set:mihomo_nameserver_policy_tencent: https://doh.pub/dns-query#DIRECT
    rule-set:mihomo_nameserver_policy_bilibili: https://doh.pub/dns-query#DIRECT
    rule-set:mihomo_nameserver_policy_xiaomi: https://doh.pub/dns-query#DIRECT
    rule-set:mihomo_nameserver_policy_bytedance: 180.184.2.2#DIRECT
    rule-set:mihomo_nameserver_policy_baidu: 180.76.76.76#DIRECT
    rule-set:mihomo_nameserver_policy_qihoo360: https://doh.360.cn/dns-query#DIRECT
    rule-set:mihomo_nameserver_policy_hotspot_captive_portal: system
    '+.m2m': system
    injections.adguard.org: system
    local.adguard.org: system
    '+.bogon': system
    rule-set:mihomo_nameserver_policy_lan_without_real_ip: system
    rule-set:mihomo_nameserver_policy_lan_with_realip: system
### 域名嗅探
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"
    - "+.apple.com"

  # ================== 模板 ======================
  ### 订阅基础配置后期可拓展多机场 [每天更新一次订阅节点，每 300 秒一次健康检查]
NodeParam: &NodeParam {type: http, interval: 86400, health-check: {enable: true, url: 'https://www.gstatic.com/generate_204', interval: 300, timeout: 2500, lazy: true}}

### 策略组基础配置
# Manual
Select: &Select {type: select, url: 'https://www.gstatic.com/generate_204', disable-udp: false, hidden: false, include-all: true, use: [订阅节点]}
# 测速 [每 300 秒一次惰性健康检查，容差 50ms，时延超过 2 秒判定为失败，失败 3 次自动触发健康检查]
UrlTest: &UrlTest {type: url-test, url: 'https://www.gstatic.com/generate_204', interval: 300, tolerance: 100, timeout: 2000, max-failed-times: 3, lazy: true, disable-udp: false, hidden: true, include-all: true, use: [订阅节点]}
# 回退 [每 300 秒一次惰性健康检查，时延超过 2 秒判定为失败，失败 3 次自动触发健康检查]
FallBack: &FallBack {type: fallback, url: 'https://www.gstatic.com/generate_204', interval: 180, timeout: 2000, max-failed-times: 2, lazy: true, disable-udp: false, hidden: true, include-all: true, use: [订阅节点]}

# 节点筛选
# 按地区筛选
FilterHK: &FilterHK "(?i)香港|HK|Hong|🇭🇰"
FilterTW: &FilterTW "(?i)台湾|TW|Tai|🇹🇼"
FilterJP: &FilterJP "(?i)日本|JP|Japan|🇯🇵"
FilterSG: &FilterSG "(?i)新加坡|SG|Singapore|狮城|🇸🇬"
FilterUS: &FilterUS "(?i)美国|US|States|America|🇺🇸"
# 排除所有包含 香港、台湾、日本、新加坡、美国 的节点
FilterOthers: &FilterOthers "(?i)^((?!(家宽|香港|HK|🇭🇰|台湾|TW|🇹🇼|日本|JP|🇯🇵|新加坡|SG|🇸🇬|美国|US|🇺🇸)).)*$"

  # 策略组
