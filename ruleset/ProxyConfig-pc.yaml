  - {name: Ⓜ️ MicrosoftService, type: select, proxies: [🎯 节点选择, 🇭🇰 - 香港A, 🇺🇸 - 美国A, ☛ - 直连], icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Microsoft.png}
  - {name: 📺 GlobalMedia, type: select, proxies: [🎯 节点选择, 🇺🇸 - 美国M, 🇭🇰 - 香港A, 🇯🇵 - 日本A, 🇸🇬 - 新加坡A, 🇺🇸 - 美国A], icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Streaming.png}
