  - {name: 🔍 Google&Play, type: select, proxies: [🎯 节点选择, 🇺🇸 - 美国M, 🇭🇰 - 香港M, 🇹🇼 - 台湾M, 🇯🇵 - 日本M, 🇸🇬 - 新加坡M, 🌐 - 其他M], icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Google.png}
