rules:
  ### 1. 局域网 / 本地拦截优先（防穿透，放首位）
  - RULE-SET,lan_non_ip,DIRECT

  ### 2. 广告阻断
  - RULE-SET,reject_non_ip,REJECT
  - RULE-SET,reject_domainset,REJECT
  - RULE-SET,reject_non_ip_drop,REJECT-DROP
  - RULE-SET,reject_non_ip_no_drop,REJECT

  ### 3. 海外核心高频服务
  - RULE-SET,telegram_non_ip,✈️ Telegram
  - RULE-SET,youtube,📺 GlobalMedia
  - RULE-SET,gemini,✨ Gemini&Labs
  - RULE-SET,googleplay,🔍 Google&Play
  - RULE-SET,stream_non_ip,📺 GlobalMedia
  - RULE-SET,googlebase,🔍 Google&Play
  - RULE-SET,ai_non_ip,🤖 AIGC

  ### 4. CDN 加速与特定直连
  - RULE-SET,cdn_domainset,🎯 节点选择
  - RULE-SET,cdn_non_ip,🎯 节点选择

  ### 5. 苹果 / 微软生态（建议 CDN 优先直连）
  - RULE-SET,apple_cn_non_ip,☛ - 直连
  - RULE-SET,apple_cdn,☛ - 直连
  - RULE-SET,apple_services,🍎 AppleService
  - RULE-SET,microsoft_cdn_non_ip,☛ - 直连
  - RULE-SET,microsoft_non_ip,Ⓜ️ MicrosoftService

  ### 6. 大文件下载（防消耗主力代理）
  - RULE-SET,download_domainset,🇺🇸 - 美国M
  - RULE-SET,download_non_ip,🇺🇸 - 美国M

  ### 7. 国内已知直连域名
  - RULE-SET,domestic_non_ip,☛ - 直连
  - RULE-SET,direct_non_ip,☛ - 直连

  ### 8. 泛外网域名（未命中国内的外网域名走代理）
  - RULE-SET,global_non_ip,🎯 节点选择

  ### 9. IP 类规则（按阻断 -> 海外 -> 局域网 -> 国内排序）
  - RULE-SET,reject_ip,REJECT
  - RULE-SET,telegram_ip,✈️ Telegram
  - RULE-SET,stream_ip,📺 GlobalMedia
  - RULE-SET,lan_ip,☛ - 直连
  - RULE-SET,domestic_ip,☛ - 直连
  - RULE-SET,china_ip,☛ - 直连

  ### 10. 境内兜底
  - GEOIP,CN,☛ - 直连

  ### 11. 最终兜底
  - MATCH,🎯 节点选择
