# ============================================================================
# Mihomo 优化配置 - 移动设备 (Android / iOS) 专属版
# ============================================================================

# ==================== 全局配置 ====================
mixed-port: 7890
allow-lan: false
mode: rule
log-level: warning
ipv6: false
find-process-mode: off
tcp-concurrent: true
unified-delay: true
global-client-fingerprint: chrome

# ==================== 缓存与状态持久化 =======================
profile:
  store-selected: true
  store-fake-ip: true

# ==================== TUN 配置（移动端流量接管核心） ====================
tun:
  enable: true
  stack: gvisor                   # 移动端推荐 gvisor 栈，内存小、连接稳定、兼容性好
  device: utun
  auto-route: true                # 自动配置全局路由
  auto-detect-interface: true     # 蜂窝/Wi-Fi 切换时自适应底层接口
  dns-hijack:
    - any:53
    - tcp://any:53
  strict-route: true              # 严格路由防止明文旁路泄漏
  mtu: 9000                       # gvisor 下 9000 吞吐高；如极个别 App 异常可降至 1500

# ==================== DNS 配置 ====================
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  respect-rules: true
  cache-algorithm: arc
  fake-ip-filter:
    - +.m2m
    - injections.adguard.org
    - local.adguard.org
    - +.bogon
    - +.local
    - +.lan
    - +.internal
    - +.localdomain
    - home.arpa
    - 127.0.0.1.sslip.io
    - 127.atlas.skk.moe
    - stun.*
    - +.stun.*
    # --- 手机系统防断连/连通性探针与 NTP 白名单 ---
    - '+.connectivitycheck.gstatic.com'
    - '+.captiveportal.kukake.org'
    - 'connectivitycheck.platform.hicloud.com'
    - 'wifi.vivo.com.cn'
    - '+.xiaomi.com'
    - 'time.*.com'
    - 'ntp.*.com'
    - '*.ntp.org.cn'

  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 直连域名专属高速 DNS（带 #DIRECT 防环路）
  direct-nameserver-follow-policy: true
  direct-nameserver:
    - https://223.5.5.5/dns-query#DIRECT
    - https://doh.pub/dns-query#DIRECT

  # 兜底查询：若有冷门域名漏到底部 IP 判定，强制走代理查询国外 DoH
  nameserver:
    - https://1.1.1.1/dns-query#🎯 节点选择
    - https://8.8.8.8/dns-query#🎯 节点选择

  nameserver-policy:
    +.cn: https://223.5.5.5/dns-query#DIRECT
    +.ip138.com: https://223.5.5.5/dns-query#DIRECT
    +.bbkss.org: https://223.5.5.5/dns-query#DIRECT
    +.owolist.cn: https://223.5.5.5/dns-query#DIRECT
    +.qinyues4.cc: https://223.5.5.5/dns-query#DIRECT
    +.todust.cc: https://223.5.5.5/dns-query#DIRECT
    +.yangliq.com: https://223.5.5.5/dns-query#DIRECT
    rule-set:mihomo_nameserver_policy_alibaba: https://223.5.5.5/dns-query#DIRECT
    rule-set:mihomo_nameserver_policy_tencent: https://doh.pub/dns-query#DIRECT
    rule-set:mihomo_nameserver_policy_bilibili: https://doh.pub/dns-query#DIRECT
    rule-set:mihomo_nameserver_policy_xiaomi: https://doh.pub/dns-query#DIRECT
    rule-set:mihomo_nameserver_policy_bytedance: 180.184.2.2#DIRECT
    rule-set:mihomo_nameserver_policy_baidu: 180.76.76.76#DIRECT
    rule-set:mihomo_nameserver_policy_qihoo360: https://doh.360.cn/dns-query#DIRECT
    rule-set:mihomo_nameserver_policy_hotspot_captive_portal: system
    '+.m2m': system
    injections.adguard.org: system
    local.adguard.org: system
    '+.bogon': system
    rule-set:mihomo_nameserver_policy_lan_without_real_ip: system
    rule-set:mihomo_nameserver_policy_lan_with_realip: system

# ==================== 域名嗅探 ====================
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"
    - "+.apple.com"

# ==================== 策略组基础模板 ====================
NodeParam: &NodeParam
  type: http
  interval: 86400
  health-check:
    enable: true
    url: 'https://www.gstatic.com/generate_204'
    interval: 600
    timeout: 2500
    lazy: true

Select: &Select
  type: select
  disable-udp: false
  hidden: false
  include-all: true
  use: [订阅节点]

# 移动端放宽容差与测速周期，兼顾省电与防频繁跳 IP
UrlTest: &UrlTest
  type: url-test
  url: 'https://www.gstatic.com/generate_204'
  interval: 600
  tolerance: 150
  timeout: 2500
  max-failed-times: 3
  lazy: true
  disable-udp: false
  hidden: true
  include-all: true
  use: [订阅节点]

# ==================== 节点正则筛选 ====================
FilterHK: &FilterHK "(?i)香港|HK|Hong|🇭🇰"
FilterTW: &FilterTW "(?i)台湾|TW|Tai|🇹🇼"
FilterJP: &FilterJP "(?i)日本|JP|Japan|🇯🇵"
FilterSG: &FilterSG "(?i)新加坡|SG|Singapore|狮城|🇸🇬"
FilterUS: &FilterUS "(?i)美国|US|States|America|🇺🇸"
FilterOthers: &FilterOthers "(?i)^((?!(香港|HK|🇭🇰|台湾|TW|🇹🇼|日本|JP|🇯🇵|新加坡|SG|🇸🇬|美国|US|🇺🇸)).)*$"

