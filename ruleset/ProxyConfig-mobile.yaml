# ==================== 分流规则 (从上至下依次匹配) ====================
rules:
  ### 1. 局域网域名放行（防穿透，放首位）
  - RULE-SET,lan_non_ip,DIRECT

  ### 2. 广告阻断
  - RULE-SET,reject_non_ip,REJECT
  - RULE-SET,reject_domainset,REJECT
  - RULE-SET,reject_non_ip_drop,REJECT-DROP
  - RULE-SET,reject_non_ip_no_drop,REJECT

  ### 3. 海外核心高频服务
  - RULE-SET,telegram_non_ip,✈️ Telegram
  - RULE-SET,tiktok,🎵 TikTok
  - RULE-SET,ai_non_ip,🤖 AIGC
  - RULE-SET,youtube,📺 GlobalMedia
  - RULE-SET,gemini,✨ Gemini&Labs
  - RULE-SET,googleplay,🔍 Google&Play
  - RULE-SET,stream_non_ip,📺 GlobalMedia
  - RULE-SET,googlebase,🔍 Google&Play

  ### 4. CDN 加速与特定直连
  - RULE-SET,cdn_domainset,🎯 节点选择
  - RULE-SET,cdn_non_ip,🎯 节点选择

  ### 5. 苹果 / 微软生态（CDN 优先直连）
  - RULE-SET,apple_cn_non_ip,DIRECT
  - RULE-SET,apple_cdn,DIRECT
  - RULE-SET,apple_services,🍎 AppleService
  - RULE-SET,microsoft_cdn_non_ip,DIRECT
  - RULE-SET,microsoft_non_ip,Ⓜ️ MicrosoftService

